<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4B5563"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" rx="12" fill="#0D0D14"/>

  <!-- Title -->
  <text x="400" y="30" font-family="monospace" font-size="12" fill="#9CA3AF" text-anchor="middle" font-weight="700" letter-spacing="2">REAL-WORLD APPLICATIONS</text>
  <line x1="60" y1="40" x2="740" y2="40" stroke="#1F2937" stroke-width="1"/>

  <!-- Central model box -->
  <rect x="320" y="90" width="160" height="100" rx="10" fill="#111520" stroke="#6366F1" stroke-width="1.5"/>
  <text x="400" y="117" font-family="monospace" font-size="10" fill="#A5B4FC" text-anchor="middle" font-weight="700">Multi-Stream</text>
  <text x="400" y="131" font-family="monospace" font-size="10" fill="#A5B4FC" text-anchor="middle" font-weight="700">Transformer</text>
  <line x1="335" y1="140" x2="465" y2="140" stroke="#1F2937" stroke-width="0.8"/>
  <text x="400" y="155" font-family="monospace" font-size="8" fill="#4F46E5" text-anchor="middle">Event History → State</text>
  <text x="400" y="167" font-family="monospace" font-size="8" fill="#4F46E5" text-anchor="middle">Vector Representation</text>

  <!-- App 1: Sub Search (left) -->
  <rect x="28" y="80" width="220" height="120" rx="10" fill="#0D1B30" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="138" y="105" font-family="monospace" font-size="10" fill="#60A5FA" text-anchor="middle" font-weight="700">🔍  Semantic Sub Search</text>
  <line x1="48" y1="113" x2="228" y2="113" stroke="#1E3A5F" stroke-width="0.8"/>
  <text x="138" y="128" font-family="monospace" font-size="8.5" fill="#93C5FD" text-anchor="middle">Query: "Need calc 2 sub"</text>
  <text x="138" y="143" font-family="monospace" font-size="8" fill="#6B7280" text-anchor="middle">↓  encode state vectors</text>
  <text x="138" y="157" font-family="monospace" font-size="8" fill="#6B7280" text-anchor="middle">↓  vector similarity search</text>
  <text x="138" y="173" font-family="monospace" font-size="8.5" fill="#34D399" text-anchor="middle">→  Ranked candidates</text>

  <!-- App 2: Anomaly Detection (right) -->
  <rect x="552" y="80" width="220" height="120" rx="10" fill="#2a0a0a" stroke="#EF4444" stroke-width="1.5"/>
  <text x="662" y="105" font-family="monospace" font-size="10" fill="#F87171" text-anchor="middle" font-weight="700">🚨  Anomaly Detection</text>
  <line x1="572" y1="113" x2="752" y2="113" stroke="#3b0f0f" stroke-width="0.8"/>
  <text x="662" y="128" font-family="monospace" font-size="8.5" fill="#FCA5A5" text-anchor="middle">Track state over time</text>
  <text x="662" y="143" font-family="monospace" font-size="8" fill="#6B7280" text-anchor="middle">↓  build behavioral baseline</text>
  <text x="662" y="157" font-family="monospace" font-size="8" fill="#6B7280" text-anchor="middle">↓  compare to population</text>
  <text x="662" y="173" font-family="monospace" font-size="8.5" fill="#F87171" text-anchor="middle">→  Flag deviations / fraud</text>

  <!-- App 3: Prediction (bottom center) -->
  <rect x="240" y="225" width="320" height="40" rx="8" fill="#052e16" stroke="#10B981" stroke-width="1.5"/>
  <text x="400" y="244" font-family="monospace" font-size="10" fill="#34D399" text-anchor="middle" font-weight="700">📊  Workforce Prediction</text>
  <text x="400" y="257" font-family="monospace" font-size="8" fill="#6B7280" text-anchor="middle">Hours forecast  ·  Shift acceptance  ·  Callout risk</text>

  <!-- Arrows -->
  <line x1="248" y1="140" x2="318" y2="140" stroke="#374151" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="482" y1="140" x2="552" y2="140" stroke="#374151" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="400" y1="192" x2="400" y2="223" stroke="#374151" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
</svg>
