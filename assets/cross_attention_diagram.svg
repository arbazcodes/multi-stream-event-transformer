<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4B5563"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8B5CF6"/>
    </marker>
  </defs>

  <rect width="800" height="240" rx="12" fill="#0D0D14"/>

  <!-- Title -->
  <text x="400" y="28" font-family="monospace" font-size="12" fill="#9CA3AF" text-anchor="middle" font-weight="700" letter-spacing="2">MULTI-SOURCE CROSS-ATTENTION FUSION</text>
  <line x1="60" y1="36" x2="740" y2="36" stroke="#1F2937" stroke-width="1"/>

  <!-- 5 encoder output boxes -->
  <!-- Employee -->
  <rect x="28" y="56" width="96" height="40" rx="6" fill="#0D1B30" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="76" y="73" font-family="monospace" font-size="9" fill="#60A5FA" text-anchor="middle" font-weight="600">👤 Employee</text>
  <text x="76" y="87" font-family="monospace" font-size="8" fill="#1D4ED8" text-anchor="middle">E₁…Eₙ  ∈ ℝᵈ</text>

  <!-- Location -->
  <rect x="140" y="56" width="96" height="40" rx="6" fill="#0A2018" stroke="#10B981" stroke-width="1.5"/>
  <text x="188" y="73" font-family="monospace" font-size="9" fill="#34D399" text-anchor="middle" font-weight="600">📍 Location</text>
  <text x="188" y="87" font-family="monospace" font-size="8" fill="#065F46" text-anchor="middle">L₁…Lₙ  ∈ ℝᵈ</text>

  <!-- Cost Code -->
  <rect x="252" y="56" width="96" height="40" rx="6" fill="#1a1030" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="300" y="73" font-family="monospace" font-size="9" fill="#A78BFA" text-anchor="middle" font-weight="600">🏢 Cost Code</text>
  <text x="300" y="87" font-family="monospace" font-size="8" fill="#4C1D95" text-anchor="middle">CC₁…CCₙ ∈ ℝᵈ</text>

  <!-- Job Code -->
  <rect x="364" y="56" width="96" height="40" rx="6" fill="#251800" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="412" y="73" font-family="monospace" font-size="9" fill="#FCD34D" text-anchor="middle" font-weight="600">💼 Job Code</text>
  <text x="412" y="87" font-family="monospace" font-size="8" fill="#92400E" text-anchor="middle">JC₁…JCₙ ∈ ℝᵈ</text>

  <!-- Event Type -->
  <rect x="476" y="56" width="96" height="40" rx="6" fill="#2a0a0a" stroke="#EF4444" stroke-width="1.5"/>
  <text x="524" y="73" font-family="monospace" font-size="9" fill="#F87171" text-anchor="middle" font-weight="600">🗂️ Event Type</text>
  <text x="524" y="87" font-family="monospace" font-size="8" fill="#7F1D1D" text-anchor="middle">ET₁…ETₙ ∈ ℝᵈ</text>

  <!-- Arrows converging down to cross-attn block -->
  <line x1="76"  y1="97" x2="330" y2="146" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="188" y1="97" x2="340" y2="146" stroke="#10B981" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="300" y1="97" x2="360" y2="146" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="412" y1="97" x2="380" y2="146" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="524" y1="97" x2="390" y2="146" stroke="#EF4444" stroke-width="1" stroke-opacity="0.7"/>

  <!-- Cross-attention block -->
  <rect x="258" y="148" width="184" height="56" rx="8" fill="#111520" stroke="#818CF8" stroke-width="2"/>
  <text x="350" y="170" font-family="monospace" font-size="10" fill="#A5B4FC" text-anchor="middle" font-weight="700">Cross-Attention</text>
  <text x="350" y="184" font-family="monospace" font-size="8" fill="#6366F1" text-anchor="middle">Q from decoder  ·  K, V from each encoder</text>
  <text x="350" y="196" font-family="monospace" font-size="8" fill="#4B5563" text-anchor="middle">outputs summed across all streams</text>

  <!-- Arrow cross-attn to output -->
  <line x1="442" y1="176" x2="630" y2="176" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Output box -->
  <rect x="632" y="150" width="140" height="52" rx="8" fill="#052e16" stroke="#10B981" stroke-width="1.5"/>
  <text x="702" y="170" font-family="monospace" font-size="9" fill="#34D399" text-anchor="middle" font-weight="700">Fused Representation</text>
  <text x="702" y="184" font-family="monospace" font-size="8" fill="#6B7280" text-anchor="middle">all streams combined</text>
  <text x="702" y="196" font-family="monospace" font-size="8" fill="#6B7280" text-anchor="middle">→  next event prediction</text>

  <!-- Formula note -->
  <text x="350" y="225" font-family="monospace" font-size="9" fill="#374151" text-anchor="middle">Attention(Q, Kᵢ, Vᵢ)  for each encoder stream  i ∈ {Employee, Location, CostCode, JobCode, EventType}</text>
</svg>
